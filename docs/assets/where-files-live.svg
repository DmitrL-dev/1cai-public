<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="920" viewBox="0 0 1000 920" role="img" aria-labelledby="storage-title storage-desc">
  <title id="storage-title">Что где хранится: три папки для работы с Рентгеном</title>
  <desc id="storage-desc">Папка выгрузки содержит исходные файлы конфигурации 1С. Состояние Рентгена содержит снимки, версии черновиков и результаты. Профиль редактора содержит настройки, рабочие копии и журналы. Сохранение рабочей копии, публикация ревизии и применение к исходникам — отдельные действия.</desc>
  <rect width="1000" height="920" rx="28" fill="#f4f6fb"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="44" y="84" fill="#172d48" font-size="54" font-weight="800">Что где хранится</text>
    <text x="46" y="137" fill="#4a5d76" font-size="31">Три отдельные папки на вашем компьютере</text>
  </g>

  <!-- The folders represent responsibilities, not a literal directory tree. -->
  <rect x="44" y="196" width="912" height="171" rx="23" fill="#fff0dc" stroke="#dfb47c" stroke-width="2"/>
  <rect x="69" y="220" width="128" height="123" rx="18" fill="#ffe2b5"/>
  <g fill="none" stroke="#ad5317" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M91 263H116L126 275H174V318H91Z M91 275H174 M108 290H156 M108 304H146"/>
  </g>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="232" y="258" fill="#562d15" font-size="42" font-weight="800">Выгрузка 1С</text>
    <text x="234" y="306" fill="#69452d" font-size="32">Исходные файлы конфигурации.</text>
    <text x="234" y="348" fill="#69452d" font-size="32">Из этой папки создаётся снимок.</text>
  </g>

  <rect x="44" y="403" width="912" height="171" rx="23" fill="#e3f5ef" stroke="#9ecfbd" stroke-width="2"/>
  <rect x="69" y="427" width="128" height="123" rx="18" fill="#c7e8dc"/>
  <g fill="none" stroke="#176d5a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="91" y="465" width="67" height="61" rx="6"/>
    <path d="M104 455H173V513 M117 445H183V502 M105 483H146 M105 499H137 M105 513H144"/>
  </g>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="232" y="465" fill="#174d40" font-size="42" font-weight="800">Состояние Рентгена</text>
    <text x="234" y="513" fill="#355f54" font-size="32">Снимки, черновики и результаты.</text>
    <text x="234" y="555" fill="#355f54" font-size="32">История хранится в ядре.</text>
  </g>

  <rect x="44" y="610" width="912" height="171" rx="23" fill="#f2eafd" stroke="#cab5e7" stroke-width="2"/>
  <rect x="69" y="634" width="128" height="123" rx="18" fill="#e2d2f5"/>
  <g fill="none" stroke="#7651aa" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="90" y="654" width="86" height="62" rx="6"/>
    <path d="M133 716V738 M112 738H154 M102 680L113 690L102 700 M129 700H158"/>
  </g>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="232" y="672" fill="#533773" font-size="42" font-weight="800">Профиль редактора</text>
    <text x="234" y="720" fill="#664d7f" font-size="32">Настройки и рабочие копии.</text>
    <text x="234" y="762" fill="#664d7f" font-size="32">Журналы работы редактора.</text>
  </g>

  <rect x="44" y="817" width="912" height="69" rx="18" fill="#e0e7f1"/>
  <text x="500" y="862" text-anchor="middle" fill="#29415e" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="700">Рабочая копия → ревизия → отдельное применение</text>
</svg>
