<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Рентген — от кода 1С к проверяемой правке</title>
  <desc id="hero-desc">Открытый проект раннего доступа. Читать сохранённый код, готовить отдельные черновики и проверять выбранную версию. Локальное ядро хранит историю; решение о применении принимает человек.</desc>
  <defs>
    <g id="hero-page" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="67" height="84" rx="10"/>
      <path d="M14 23H51M14 39H44M14 55H51M14 69H35"/>
    </g>
    <marker id="hero-arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L10 6L2 10" fill="none" stroke="#88a3bd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1200" height="430" rx="28" fill="#10263e"/>
  <rect x="30" y="32" width="6" height="363" rx="3" fill="#6ae0c3"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="61" y="76" fill="#a1ead9" font-size="25" font-weight="700" letter-spacing="1">ИСХОДНИКИ 1С · ОТКРЫТЫЙ КОД</text>
    <rect x="928" y="40" width="220" height="46" rx="23" fill="#ffe0a5"/>
    <text x="1038" y="72" text-anchor="middle" fill="#5e3b13" font-size="25" font-weight="700">Ранний доступ</text>
    <text x="56" y="199" fill="#ffffff" font-size="102" font-weight="800">Рентген</text>
    <text x="61" y="265" fill="#edf4fd" font-size="37" font-weight="600">Понять код 1С.</text>
    <text x="61" y="313" fill="#edf4fd" font-size="37" font-weight="600">Подготовить и проверить правку.</text>
    <text x="61" y="388" fill="#becfe2" font-size="26">Локальное ядро · Отдельные черновики · Ваша история</text>
  </g>

  <!-- A simple document flow, not a screenshot or an assurance of acceptance. -->
  <g fill="none" stroke="#88a3bd" stroke-width="3" marker-end="url(#hero-arrow)">
    <path d="M824 181H848"/>
    <path d="M975 181H999"/>
  </g>
  <rect x="705" y="124" width="114" height="114" rx="23" fill="#173f42" stroke="#457d74" stroke-width="2"/>
  <rect x="856" y="124" width="114" height="114" rx="23" fill="#38345b" stroke="#8572b2" stroke-width="2"/>
  <rect x="1007" y="124" width="114" height="114" rx="23" fill="#234466" stroke="#688ead" stroke-width="2"/>
  <use href="#hero-page" x="729" y="139" stroke="#8de8ce"/>
  <g transform="translate(879 146)" fill="none" stroke="#d3c0fb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 63L10 48L52 6L65 19L23 61ZM41 17L54 30M5 75H65"/>
  </g>
  <g transform="translate(1034 145)" fill="none" stroke="#b2d9ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect width="58" height="76" rx="8"/>
    <path d="M13 24L20 31L34 16M39 26H47M14 50H44M14 62H35"/>
  </g>
  <g font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="middle">
    <text x="762" y="281" fill="#a1ead9">Снимок</text>
    <text x="913" y="281" fill="#d3c0fb">Черновик</text>
    <text x="1064" y="281" fill="#b2d9ff">Проверка</text>
  </g>
