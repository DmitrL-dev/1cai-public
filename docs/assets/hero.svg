<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="590" viewBox="0 0 1280 590" role="img" aria-labelledby="title desc">
  <title id="title">Рентген — понять код 1С, проверить правку, решить самому</title>
  <desc id="desc">Локальное открытое ядро раннего доступа. Снимок, отдельный черновик, результат выбранной версии. Схема, не снимок интерфейса.</desc>
  <rect width="1280" height="590" rx="28" fill="#0c1524" />
  <g font-family="DejaVu Sans,Segoe UI,Arial,sans-serif">
    <defs>
      <linearGradient id="accent" x1="0" x2="1" y1="0" y2="1">
        <stop stop-color="#85f6d6" />
        <stop offset="1" stop-color="#8f98ff" />
      </linearGradient>
    </defs>
    <rect x="40" y="42" width="66" height="66" rx="18" fill="url(#accent)" />
    <g fill="none" stroke="#102238" stroke-width="5" stroke-linecap="round">
      <path d="M58 65L73 51L89 65M58 85L73 99L89 85" />
      <path d="M65 73H81" />
    </g>
    <text x="128" y="71" font-size="29" fill="#f4f7fc" font-weight="800">РЕНТГЕН</text>
    <text x="128" y="97" font-size="15" fill="#a8b9d3" font-weight="600">ИСХОДНИКИ 1С · MIT</text>
    <rect x="1010" y="49" width="222" height="44" rx="22" fill="#253128" stroke="#62714c" stroke-width="1.5" />
    <text x="1121" y="78" font-size="16" fill="#d9efad" font-weight="700" text-anchor="middle">РАННИЙ ДОСТУП</text>
    <text x="44" y="202" font-size="57" fill="#f4f7fc" font-weight="800">Понять код 1С.</text>
    <text x="44" y="278" font-size="52" fill="#f4f7fc" font-weight="800">Проверить правку.</text>
    <text x="44" y="352" font-size="57" fill="#90f4d6" font-weight="800">Решить самому.</text>
    <text x="48" y="420" font-size="24" fill="#b8c7dd" font-weight="400">Снимки. Отдельные черновики.</text>
    <text x="48" y="455" font-size="24" fill="#b8c7dd" font-weight="400">Результаты для выбранной версии.</text>
    <rect x="46" y="500" width="290" height="45" rx="22" fill="#172a3b" stroke="#29445b" stroke-width="1.5" />
    <text x="191" y="530" font-size="17" fill="#cbddf4" font-weight="700" text-anchor="middle">ЛОКАЛЬНОЕ ЯДРО</text>
    <rect x="743" y="147" width="489" height="390" rx="24" fill="#152237" stroke="#36445e" stroke-width="1.5" />
    <text x="768" y="180" font-size="14" fill="#a9b9d1" font-weight="700">СХЕМА СЦЕНАРИЯ</text>
    <rect x="766" y="204" width="441" height="84" rx="14" fill="#1b3043" />
    <rect x="766" y="204" width="5" height="84" rx="2" fill="#75e5c1" />
    <rect x="766" y="308" width="441" height="84" rx="14" fill="#1b3043" />
    <rect x="766" y="308" width="5" height="84" rx="2" fill="#b8a0ff" />
    <rect x="766" y="412" width="441" height="84" rx="14" fill="#1b3043" />
    <rect x="766" y="412" width="5" height="84" rx="2" fill="#eec475" />
    <text x="790" y="235" font-size="23" fill="#92f1d2" font-weight="700">01  Снимок исходников</text>
    <text x="790" y="265" font-size="18" fill="#bbcce2" font-weight="400">Одна сохранённая версия</text>
    <text x="790" y="339" font-size="23" fill="#cebfff" font-weight="700">02  Предложение правки</text>
    <text x="790" y="369" font-size="18" fill="#bbcce2" font-weight="400">Своя история и сравнение</text>
    <text x="790" y="443" font-size="23" fill="#f4d69e" font-weight="700">03  Проверка ревизии</text>
    <text x="790" y="473" font-size="18" fill="#bbcce2" font-weight="400">Результат виден до решения</text>
    <text x="47" y="575" font-size="17" fill="#aebed5" font-weight="400">Windows — опубликованный профиль. Linux / macOS — поэтапная разработка.</text>
  </g>
</svg>
