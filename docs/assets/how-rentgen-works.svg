<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="2020" viewBox="0 0 1000 2020" role="img" aria-labelledby="workflow-title workflow-desc">
  <title id="workflow-title">Рентген: путь одной правки от исходников до решения</title>
  <desc id="workflow-desc">Шесть шагов. Подготовленная выгрузка 1С становится сохранённым снимком. Первый результат — снимок и список модулей; модель и установленная 1С для него не нужны, если выгрузка уже есть. Найдите модуль снимка. Первый ручной черновик создают командами ядра через CLI; затем существующий черновик можно дорабатывать в рабочей копии редактора. Другой маршрут создаёт черновик с AI. Сравните и проверьте выбранную ревизию. При замечаниях создайте новую ревизию и проверьте её. Человек решает доработать, оставить предложение в истории или отдельно применить поддержанную правку. Запись в выгрузку и обновление базы 1С — самостоятельные операции.</desc>
  <defs>
    <marker id="flow-arrow" markerWidth="15" markerHeight="15" refX="11" refY="7.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M3 2L12 7.5L3 13" fill="none" stroke="#62788e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="return-arrow" markerWidth="15" markerHeight="15" refX="11" refY="7.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M3 2L12 7.5L3 13" fill="none" stroke="#7852a9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <g id="read-icon" fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="49" height="59" rx="6"/>
      <path d="M10 14H33M10 25H27"/>
      <circle cx="38" cy="38" r="13"/>
      <path d="M48 49L62 63"/>
    </g>
    <g id="write-icon" fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 56L7 43L44 6L57 19L20 56ZM35 15L48 28M2 67H58"/>
    </g>
  </defs>

  <rect width="1000" height="2020" rx="28" fill="#f5f7fc"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="44" y="79" fill="#17314c" font-size="46" font-weight="800">Рентген: путь одной правки</text>
    <text x="46" y="127" fill="#475d76" font-size="29">Читайте сверху вниз. Начните со снимка.</text>
    <rect x="44" y="158" width="292" height="39" rx="19" fill="#17314c"/>
    <text x="190" y="185" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700" letter-spacing="1">НАЧНИТЕ ЗДЕСЬ</text>
  </g>

  <!-- 1 → 2: files enter the workflow through a retained snapshot. -->
  <rect x="44" y="211" width="430" height="218" rx="22" fill="#fff1dd" stroke="#ddaf74" stroke-width="2"/>
  <rect x="526" y="211" width="430" height="218" rx="22" fill="#e1f4eb" stroke="#93c8b2" stroke-width="2"/>
  <circle cx="95" cy="260" r="29" fill="#a45114"/>
  <circle cx="577" cy="260" r="29" fill="#176b53"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="95" y="271" text-anchor="middle" fill="#ffffff" font-size="31" font-weight="800">1</text>
    <text x="577" y="271" text-anchor="middle" fill="#ffffff" font-size="31" font-weight="800">2</text>
    <text x="138" y="272" fill="#5a3215" font-size="34" font-weight="800">Выгрузка 1С</text>
    <text x="620" y="272" fill="#174d3c" font-size="34" font-weight="800">Снимок файлов</text>
    <text x="73" y="329" fill="#67462a" font-size="30">Папка с XML</text>
    <text x="73" y="370" fill="#67462a" font-size="30">и модулями 1С.</text>
    <text x="73" y="409" fill="#67462a" font-size="26">Подготовлена заранее.</text>
    <text x="555" y="329" fill="#315f4e" font-size="30">Копия выбранной версии.</text>
    <text x="555" y="370" fill="#315f4e" font-size="28">ID для чтения и сравнения.</text>
    <text x="555" y="409" fill="#315f4e" font-size="26">Файлы остаются в истории.</text>
  </g>
  <path d="M481 317H518" fill="none" stroke="#62788e" stroke-width="3" marker-end="url(#flow-arrow)"/>
  <path d="M741 430V453" fill="none" stroke="#62788e" stroke-width="3" marker-end="url(#flow-arrow)"/>

  <rect x="44" y="461" width="912" height="111" rx="20" fill="#cceade"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="73" y="505" fill="#174d3c" font-size="30" font-weight="800">Первый результат: снимок + список модулей</text>
    <text x="73" y="550" fill="#315f4e" font-size="27">Без AI и установленной 1С, если выгрузка уже есть.</text>
  </g>
  <path d="M500 574V629" fill="none" stroke="#62788e" stroke-width="3" marker-end="url(#flow-arrow)"/>

  <!-- 3: source viewing is bound to the selected snapshot. -->
  <rect x="44" y="638" width="912" height="163" rx="22" fill="#e8efff" stroke="#a8bce4" stroke-width="2"/>
  <circle cx="95" cy="687" r="29" fill="#3e5b9c"/>
  <use href="#read-icon" x="870" y="660" stroke="#3e5b9c"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="95" y="698" text-anchor="middle" fill="#ffffff" font-size="31" font-weight="800">3</text>
    <text x="138" y="698" fill="#263e6f" font-size="35" font-weight="800">Найдите и прочитайте модуль</text>
    <text x="138" y="747" fill="#435b81" font-size="30">Откройте код выбранного снимка в редакторе.</text>
    <text x="138" y="785" fill="#435b81" font-size="27">Поиск работает по части пути.</text>
  </g>
  <path d="M500 803V857" fill="none" stroke="#62788e" stroke-width="3" marker-end="url(#flow-arrow)"/>

  <!-- 4: both routes create a proposal with its own revision history. -->
  <rect x="44" y="866" width="912" height="298" rx="22" fill="#f1eafb" stroke="#c4afe0" stroke-width="2"/>
  <circle cx="95" cy="915" r="29" fill="#74509f"/>
  <use href="#write-icon" x="870" y="889" stroke="#74509f"/>
  <rect x="73" y="953" width="412" height="143" rx="17" fill="#ffffff" stroke="#d5c5e8" stroke-width="1.5"/>
  <rect x="515" y="953" width="412" height="143" rx="17" fill="#ffffff" stroke="#d5c5e8" stroke-width="1.5"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="95" y="926" text-anchor="middle" fill="#ffffff" font-size="31" font-weight="800">4</text>
    <text x="138" y="926" fill="#4f3470" font-size="34" font-weight="800">Подготовьте отдельный черновик</text>
    <text x="102" y="998" fill="#4f3470" font-size="29" font-weight="700">Вручную</text>
    <text x="544" y="998" fill="#4f3470" font-size="29" font-weight="700">С помощью AI</text>
    <text x="102" y="1041" fill="#614b7b" font-size="28">Первый — через CLI.</text>
    <text x="102" y="1080" fill="#614b7b" font-size="28">Дальше — в редакторе.</text>
    <text x="544" y="1041" fill="#614b7b" font-size="28">Модель предложит правку.</text>
    <text x="544" y="1080" fill="#614b7b" font-size="28">Вы изучите результат.</text>
    <text x="73" y="1142" fill="#614b7b" font-size="26">Версии черновика связаны с исходным снимком.</text>
  </g>
  <path d="M500 1166V1219" fill="none" stroke="#62788e" stroke-width="3" marker-end="url(#flow-arrow)"/>

  <!-- 5: each installed check reports about a saved revision. -->
  <rect x="44" y="1228" width="912" height="294" rx="22" fill="#e3f1ff" stroke="#a2c4e0" stroke-width="2"/>
  <circle cx="95" cy="1277" r="29" fill="#23648e"/>
  <rect x="73" y="1320" width="265" height="122" rx="17" fill="#ffffff" stroke="#bfd6e9" stroke-width="1.5"/>
  <rect x="368" y="1320" width="265" height="122" rx="17" fill="#ffffff" stroke="#bfd6e9" stroke-width="1.5"/>
  <rect x="663" y="1320" width="264" height="122" rx="17" fill="#ffffff" stroke="#bfd6e9" stroke-width="1.5"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="95" y="1288" text-anchor="middle" fill="#ffffff" font-size="31" font-weight="800">5</text>
    <text x="138" y="1288" fill="#1e4b6c" font-size="34" font-weight="800">Сравните и проверьте эту версию</text>
    <text x="95" y="1361" fill="#1e4b6c" font-size="30" font-weight="700">Сравнение</text>
    <text x="390" y="1361" fill="#1e4b6c" font-size="30" font-weight="700">BSL</text>
    <text x="685" y="1361" fill="#1e4b6c" font-size="30" font-weight="700">1С и тесты</text>
    <text x="95" y="1398" fill="#365e7d" font-size="28">Изменённые</text>
    <text x="95" y="1431" fill="#365e7d" font-size="28">строки</text>
    <text x="390" y="1398" fill="#365e7d" font-size="28">Java +</text>
    <text x="390" y="1431" fill="#365e7d" font-size="28">BSL-LS</text>
    <text x="685" y="1398" fill="#365e7d" font-size="28">Платформа +</text>
    <text x="685" y="1431" fill="#365e7d" font-size="27">профиль YAxUnit</text>
    <text x="73" y="1488" fill="#365e7d" font-size="27">Для BSL, платформы и тестов нужна настройка.</text>
  </g>

  <!-- A visible feedback loop; it is not an automatic model retry. -->
  <path d="M958 1380H975V932H960" fill="none" stroke="#7852a9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#return-arrow)"/>
  <rect x="664" y="1181" width="291" height="36" rx="18" fill="#e7dbf6"/>
  <text x="809.5" y="1206" text-anchor="middle" fill="#5a3a7e" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">Замечания? Доработайте</text>
  <path d="M500 1524V1579" fill="none" stroke="#62788e" stroke-width="3" marker-end="url(#flow-arrow)"/>

  <!-- 6: saving and checks do not trigger live application. -->
  <rect x="44" y="1588" width="912" height="275" rx="22" fill="#edf1f8" stroke="#b4c3d6" stroke-width="2"/>
  <circle cx="95" cy="1637" r="29" fill="#324e6e"/>
  <rect x="73" y="1678" width="265" height="96" rx="17" fill="#ffffff" stroke="#c4d0df" stroke-width="1.5"/>
  <rect x="368" y="1678" width="265" height="96" rx="17" fill="#ffffff" stroke="#c4d0df" stroke-width="1.5"/>
  <rect x="663" y="1678" width="264" height="96" rx="17" fill="#fff0d6" stroke="#d8b27b" stroke-width="1.5"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="95" y="1648" text-anchor="middle" fill="#ffffff" font-size="31" font-weight="800">6</text>
    <text x="138" y="1648" fill="#243f5d" font-size="34" font-weight="800">Решение принимает человек</text>
    <text x="95" y="1714" fill="#243f5d" font-size="27" font-weight="700">Доработать</text>
    <text x="95" y="1751" fill="#4a607a" font-size="27">новой ревизией</text>
    <text x="390" y="1714" fill="#243f5d" font-size="27" font-weight="700">Оставить</text>
    <text x="390" y="1751" fill="#4a607a" font-size="27">в истории</text>
    <text x="685" y="1714" fill="#704613" font-size="27" font-weight="700">Применить</text>
    <text x="685" y="1751" fill="#704613" font-size="27">отдельно</text>
    <text x="73" y="1805" fill="#4a607a" font-size="26">Для применения нужен поддержанный сценарий</text>
    <text x="73" y="1840" fill="#4a607a" font-size="26">и отдельная операция с проверкой её условий.</text>
  </g>

  <rect x="44" y="1899" width="912" height="88" rx="20" fill="#17314c"/>
  <g font-family="Segoe UI,Arial,sans-serif" fill="#ffffff">
    <text x="73" y="1935" font-size="26" font-weight="700">Сохранение и успешный отчёт не применяют правку.</text>
    <text x="73" y="1970" font-size="25">Запись в выгрузку и обновление базы 1С — отдельные операции.</text>
  </g>
</svg>
