<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1300" viewBox="0 0 1000 1300" role="img" aria-labelledby="steps-title steps-desc">
  <title id="steps-title">Как работает Рентген: шесть шагов от исходников до решения</title>
  <desc id="steps-desc">Читайте карточки слева направо и сверху вниз. 1: выберите папку выгрузки 1С. 2: сохраните снимок файлов. 3: найдите и прочитайте модуль сохранённой версии. 4: создайте отдельный черновик сами или с AI. 5: сравните изменения и запустите настроенные проверки. 6: примите решение; применение требует отдельного действия. Сохранение черновика не применяет его к исходникам.</desc>
  <defs>
    <marker id="step-arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2L10 6L2 10" fill="none" stroke="#637791" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <g id="folder-icon" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 22H28L38 32H75V69H5Z M5 32H75 M20 48H58 M20 59H49"/>
    </g>
    <g id="snapshot-icon" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="23" width="60" height="47" rx="5"/>
      <path d="M17 15H72V59 M26 7H77V49 M21 38H53 M21 51H59 M21 61H45"/>
    </g>
    <g id="search-icon" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="8" width="54" height="62" rx="6"/>
      <path d="M17 24H40 M17 35H33"/>
      <circle cx="48" cy="49" r="17" fill="currentColor" fill-opacity="0.08"/>
      <path d="M60 61L76 76"/>
    </g>
    <g id="draft-icon" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 70L13 51L57 7L72 22L28 66Z M47 17L62 32 M7 77H74"/>
    </g>
    <g id="check-icon" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="10" y="7" width="59" height="69" rx="6"/>
      <path d="M23 29L29 35L41 21 M48 29H58 M23 56L29 62L41 48 M48 56H58"/>
    </g>
    <g id="decision-icon" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="40" cy="24" r="12"/>
      <path d="M13 74V65C13 50 25 43 40 43C55 43 67 50 67 65V74 M27 63L36 72L52 54"/>
    </g>
  </defs>

  <rect width="1000" height="1300" rx="28" fill="#f4f6fb"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="44" y="84" fill="#172d48" font-size="54" font-weight="800">От исходников до решения</text>
    <text x="46" y="133" fill="#4a5d76" font-size="31">Шесть шагов. Применение — отдельное действие.</text>
  </g>

  <!-- The numbering and arrows give the same reading order without relying on colour. -->
  <g fill="none" stroke="#637791" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#step-arrow)">
    <path d="M489 330H507"/>
    <path d="M738 481V501H263V512"/>
    <path d="M489 672H507"/>
    <path d="M738 823V843H263V854"/>
    <path d="M489 1014H507"/>
  </g>

  <!-- 1. A source directory is the input, not a running information base. -->
  <rect x="44" y="180" width="438" height="300" rx="23" fill="#fff0dc" stroke="#dfb47c" stroke-width="2"/>
  <circle cx="95" cy="234" r="30" fill="#bd5b16"/>
  <text x="95" y="245" text-anchor="middle" fill="#ffffff" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="800">1</text>
  <use href="#folder-icon" x="383" y="197" stroke="#ad5317"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="72" y="306" fill="#562d15" font-size="42" font-weight="800">Выберите</text>
    <text x="72" y="356" fill="#562d15" font-size="42" font-weight="800">выгрузку 1С</text>
    <text x="74" y="416" fill="#69452d" font-size="32">Папка исходников</text>
    <text x="74" y="458" fill="#69452d" font-size="32">вашей конфигурации.</text>
  </g>

  <!-- 2. Retained source files make the version explicit. -->
  <rect x="518" y="180" width="438" height="300" rx="23" fill="#e3f5ef" stroke="#9ecfbd" stroke-width="2"/>
  <circle cx="569" cy="234" r="30" fill="#176d5a"/>
  <text x="569" y="245" text-anchor="middle" fill="#ffffff" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="800">2</text>
  <use href="#snapshot-icon" x="857" y="197" stroke="#176d5a"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="546" y="306" fill="#174d40" font-size="42" font-weight="800">Сохраните</text>
    <text x="546" y="356" fill="#174d40" font-size="42" font-weight="800">снимок</text>
    <text x="548" y="416" fill="#355f54" font-size="32">Файлы закреплены</text>
    <text x="548" y="458" fill="#355f54" font-size="32">за своей версией.</text>
  </g>

  <!-- 3. The editor shows a retained module. Graph analysis is a separate core interface. -->
  <rect x="44" y="522" width="438" height="300" rx="23" fill="#e9eeff" stroke="#b0bce3" stroke-width="2"/>
  <circle cx="95" cy="576" r="30" fill="#4553ac"/>
  <text x="95" y="587" text-anchor="middle" fill="#ffffff" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="800">3</text>
  <use href="#search-icon" x="383" y="539" stroke="#4553ac" color="#4553ac"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="72" y="648" fill="#28396d" font-size="42" font-weight="800">Найдите</text>
    <text x="72" y="698" fill="#28396d" font-size="42" font-weight="800">модуль</text>
    <text x="74" y="758" fill="#455582" font-size="32">Откройте код</text>
    <text x="74" y="800" fill="#455582" font-size="32">сохранённой версии.</text>
  </g>

  <!-- 4. A draft is separate from source files; manual and model routes both exist. -->
  <rect x="518" y="522" width="438" height="300" rx="23" fill="#f2eafd" stroke="#cab5e7" stroke-width="2"/>
  <circle cx="569" cy="576" r="30" fill="#7651aa"/>
  <text x="569" y="587" text-anchor="middle" fill="#ffffff" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="800">4</text>
  <use href="#draft-icon" x="857" y="539" stroke="#7651aa"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="546" y="648" fill="#533773" font-size="42" font-weight="800">Создайте</text>
    <text x="546" y="698" fill="#533773" font-size="42" font-weight="800">черновик</text>
    <text x="548" y="758" fill="#664d7f" font-size="32">Сами или с AI.</text>
    <text x="548" y="800" fill="#664d7f" font-size="32">Отдельно от исходника.</text>
  </g>

  <!-- 5. Native and test checks require their own installed and trusted profiles. -->
  <rect x="44" y="864" width="438" height="300" rx="23" fill="#e2f2ff" stroke="#a8cce5" stroke-width="2"/>
  <circle cx="95" cy="918" r="30" fill="#23678f"/>
  <text x="95" y="929" text-anchor="middle" fill="#ffffff" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="800">5</text>
  <use href="#check-icon" x="383" y="881" stroke="#23678f"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="72" y="994" fill="#214969" font-size="40" font-weight="800">Проверьте версию</text>
    <text x="74" y="1048" fill="#365d79" font-size="32">Сравнение и BSL.</text>
    <text x="74" y="1090" fill="#365d79" font-size="32">1С и тесты —</text>
    <text x="74" y="1132" fill="#365d79" font-size="32">после настройки.</text>
  </g>

  <!-- 6. Checks and saving never replace the user's separate decision. -->
  <rect x="518" y="864" width="438" height="300" rx="23" fill="#e9f4dd" stroke="#b4cf97" stroke-width="2"/>
  <circle cx="569" cy="918" r="30" fill="#4d752b"/>
  <text x="569" y="929" text-anchor="middle" fill="#ffffff" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="800">6</text>
  <use href="#decision-icon" x="857" y="881" stroke="#4d752b"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="546" y="990" fill="#355121" font-size="42" font-weight="800">Решение —</text>
    <text x="546" y="1040" fill="#355121" font-size="42" font-weight="800">за вами</text>
    <text x="548" y="1100" fill="#4b643a" font-size="32">Отдельный шаг</text>
    <text x="548" y="1142" fill="#4b643a" font-size="32">для применения.</text>
  </g>

  <rect x="44" y="1202" width="912" height="60" rx="18" fill="#e0e7f1"/>
  <text x="500" y="1243" text-anchor="middle" fill="#29415e" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="700">Черновик ≠ применение к исходникам</text>
</svg>
