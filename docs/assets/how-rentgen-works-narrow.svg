  <text x="48" y="3434" fill="#ffffff" font-size="28" font-weight="800" text-anchor="middle">6</text>
  <text x="82" y="3432" fill="#243f5d" font-size="26" font-weight="800" text-anchor="start">Решает человек</text>
  <text x="36" y="3474" fill="#4a607a" font-size="24" font-weight="400" text-anchor="start">Выберите, что сделать</text>
  <text x="36" y="3506" fill="#4a607a" font-size="24" font-weight="400" text-anchor="start">с предложением.</text>
  <rect x="32" y="3528" width="296" height="120" rx="16" fill="#ffffff" stroke="#c4d0df" stroke-width="1.5"/>
