<svg xmlns="http://www.w3.org/2000/svg" width="360" height="4504" viewBox="0 0 360 4504" role="img" aria-labelledby="workflow-narrow-title workflow-narrow-desc">
  <title id="workflow-narrow-title">Рентген: путь одной правки — вертикальная схема</title>
  <desc id="workflow-narrow-desc">Шесть шагов сверху вниз. Подготовленная выгрузка 1С становится сохранённым снимком. Первый результат — снимок и список модулей; модель и установленная 1С для него не нужны, если выгрузка уже есть. Найдите и прочитайте модуль снимка. Первый ручной черновик создают командами ядра через CLI; затем существующий черновик можно дорабатывать в редакторе. Другой маршрут создаёт черновик с AI: пользователь изучает предложение модели. Сравните и проверьте выбранную сохранённую ревизию. При замечаниях вернитесь к черновику, создайте новую ревизию и проверьте её; прежняя проверка относится к прежнему тексту. Человек решает доработать, оставить предложение в истории или отдельно применить поддержанную правку с проверкой условий отдельной операции. Сохранение и успешный отчёт не применяют правку. Запись в выгрузку и обновление базы 1С — самостоятельные операции.</desc>
  <defs>
    <marker id="narrow-flow-arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M3 2L10 6L3 10" fill="none" stroke="#62788e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="narrow-return-arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M3 2L10 6L3 10" fill="none" stroke="#7852a9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="360" height="4504" rx="24" fill="#f5f7fc"/>
  <g font-family="Segoe UI,Arial,sans-serif">
  <text x="28" y="49" fill="#17314c" font-size="36" font-weight="800" text-anchor="start">Рентген</text>
  <text x="28" y="89" fill="#17314c" font-size="28" font-weight="800" text-anchor="start">Путь одной правки</text>
  <text x="28" y="125" fill="#475d76" font-size="24" font-weight="400" text-anchor="start">Читайте сверху вниз.</text>
  <rect x="16" y="158" width="328" height="202" rx="20" fill="#fff1dd" stroke="#ddaf74" stroke-width="1.5"/>
  <circle cx="48" cy="202" r="21" fill="#a45114"/>
  <text x="48" y="212" fill="#ffffff" font-size="28" font-weight="800" text-anchor="middle">1</text>
  <text x="82" y="210" fill="#5a3215" font-size="26" font-weight="800" text-anchor="start">Выгрузка 1С</text>
  <text x="36" y="252" fill="#67462a" font-size="24" font-weight="400" text-anchor="start">Папка с XML</text>
  <text x="36" y="284" fill="#67462a" font-size="24" font-weight="400" text-anchor="start">и модулями 1С.</text>
  <text x="36" y="316" fill="#67462a" font-size="24" font-weight="400" text-anchor="start">Подготовлена заранее.</text>
  <path d="M180 378V406" fill="none" stroke="#62788e" stroke-width="3" marker-end="url(#narrow-flow-arrow)"/>
  <rect x="16" y="426" width="328" height="300" rx="20" fill="#e1f4eb" stroke="#93c8b2" stroke-width="1.5"/>
  <circle cx="48" cy="470" r="21" fill="#176b53"/>
  <text x="48" y="480" fill="#ffffff" font-size="28" font-weight="800" text-anchor="middle">2</text>
  <text x="82" y="478" fill="#174d3c" font-size="26" font-weight="800" text-anchor="start">Снимок файлов</text>
  <text x="36" y="520" fill="#315f4e" font-size="24" font-weight="400" text-anchor="start">Копия выбранной</text>
  <text x="36" y="552" fill="#315f4e" font-size="24" font-weight="400" text-anchor="start">версии файлов.</text>
  <text x="36" y="584" fill="#315f4e" font-size="24" font-weight="400" text-anchor="start">ID для чтения</text>
  <text x="36" y="616" fill="#315f4e" font-size="24" font-weight="400" text-anchor="start">и сравнения.</text>
  <text x="36" y="648" fill="#315f4e" font-size="24" font-weight="400" text-anchor="start">Файлы остаются</text>
  <text x="36" y="680" fill="#315f4e" font-size="24" font-weight="400" text-anchor="start">в истории.</text>
  <rect x="16" y="746" width="328" height="258" rx="20" fill="#cceade" stroke="#93c8b2" stroke-width="1.5"/>
  <text x="36" y="788" fill="#174d3c" font-size="26" font-weight="800" text-anchor="start">Первый результат</text>
  <text x="36" y="832" fill="#315f4e" font-size="24" font-weight="400" text-anchor="start">Снимок + список</text>
  <text x="36" y="864" fill="#315f4e" font-size="24" font-weight="400" text-anchor="start">модулей.</text>
  <text x="36" y="896" fill="#315f4e" font-size="24" font-weight="400" text-anchor="start">AI и установленная</text>
  <text x="36" y="928" fill="#315f4e" font-size="24" font-weight="400" text-anchor="start">1С не нужны, если</text>
  <text x="36" y="960" fill="#315f4e" font-size="24" font-weight="400" text-anchor="start">выгрузка уже есть.</text>
