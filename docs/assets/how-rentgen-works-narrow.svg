  <rect x="16" y="1406" width="328" height="748" rx="20" fill="#f1eafb" stroke="#c4afe0" stroke-width="1.5"/>
  <circle cx="48" cy="1450" r="21" fill="#74509f"/>
  <text x="48" y="1460" fill="#ffffff" font-size="28" font-weight="800" text-anchor="middle">4</text>
  <text x="82" y="1458" fill="#4f3470" font-size="26" font-weight="800" text-anchor="start">Черновик правки</text>
  <text x="36" y="1500" fill="#614b7b" font-size="24" font-weight="400" text-anchor="start">Отдельное предложение</text>
  <text x="36" y="1532" fill="#614b7b" font-size="24" font-weight="400" text-anchor="start">изменения.</text>
  <rect x="32" y="1554" width="296" height="240" rx="16" fill="#ffffff" stroke="#d5c5e8" stroke-width="1.5"/>
  <text x="48" y="1595" fill="#4f3470" font-size="26" font-weight="700" text-anchor="start">Вручную</text>
  <text x="48" y="1634" fill="#4f3470" font-size="24" font-weight="400" text-anchor="start">Первый — командами</text>
  <text x="48" y="1666" fill="#4f3470" font-size="24" font-weight="400" text-anchor="start">ядра через CLI.</text>
  <text x="48" y="1698" fill="#4f3470" font-size="24" font-weight="400" text-anchor="start">Дальше дорабатывают</text>
  <text x="48" y="1730" fill="#4f3470" font-size="24" font-weight="400" text-anchor="start">сохранённый черновик</text>
  <text x="48" y="1762" fill="#4f3470" font-size="24" font-weight="400" text-anchor="start">в редакторе.</text>
  <rect x="32" y="1810" width="296" height="184" rx="16" fill="#ffffff" stroke="#d5c5e8" stroke-width="1.5"/>
  <text x="48" y="1851" fill="#4f3470" font-size="26" font-weight="700" text-anchor="start">С помощью AI</text>
  <text x="48" y="1890" fill="#4f3470" font-size="24" font-weight="400" text-anchor="start">Модель предложит</text>
  <text x="48" y="1922" fill="#4f3470" font-size="24" font-weight="400" text-anchor="start">правку.</text>
  <text x="48" y="1954" fill="#4f3470" font-size="24" font-weight="400" text-anchor="start">Вы изучите результат.</text>
  <text x="36" y="2040" fill="#614b7b" font-size="24" font-weight="400" text-anchor="start">Версии черновика</text>
  <text x="36" y="2072" fill="#614b7b" font-size="24" font-weight="400" text-anchor="start">связаны с исходным</text>
  <text x="36" y="2104" fill="#614b7b" font-size="24" font-weight="400" text-anchor="start">снимком.</text>
