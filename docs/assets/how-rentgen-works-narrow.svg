  <rect x="16" y="1070" width="328" height="270" rx="20" fill="#e8efff" stroke="#a8bce4" stroke-width="1.5"/>
  <circle cx="48" cy="1114" r="21" fill="#3e5b9c"/>
  <text x="48" y="1124" fill="#ffffff" font-size="28" font-weight="800" text-anchor="middle">3</text>
  <text x="82" y="1122" fill="#263e6f" font-size="26" font-weight="800" text-anchor="start">Найдите модуль</text>
  <text x="36" y="1164" fill="#435b81" font-size="24" font-weight="400" text-anchor="start">Откройте и прочитайте</text>
  <text x="36" y="1196" fill="#435b81" font-size="24" font-weight="400" text-anchor="start">код выбранного снимка</text>
  <text x="36" y="1228" fill="#435b81" font-size="24" font-weight="400" text-anchor="start">в редакторе.</text>
  <text x="36" y="1260" fill="#435b81" font-size="24" font-weight="400" text-anchor="start">Ищите модуль</text>
  <text x="36" y="1292" fill="#435b81" font-size="24" font-weight="400" text-anchor="start">по части пути.</text>
