  <text x="36" y="4246" fill="#ffffff" font-size="24" font-weight="700" text-anchor="start">Сохранение и</text>
  <text x="36" y="4278" fill="#ffffff" font-size="24" font-weight="700" text-anchor="start">успешный отчёт</text>
