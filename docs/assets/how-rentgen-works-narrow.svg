  <text x="36" y="2346" fill="#365e7d" font-size="24" font-weight="400" text-anchor="start">и проверьте эту</text>
  <text x="36" y="2378" fill="#365e7d" font-size="24" font-weight="400" text-anchor="start">сохранённую ревизию.</text>
  <rect x="32" y="2400" width="296" height="120" rx="16" fill="#ffffff" stroke="#bfd6e9" stroke-width="1.5"/>
  <text x="48" y="2441" fill="#1e4b6c" font-size="26" font-weight="700" text-anchor="start">Сравнение</text>
  <text x="48" y="2480" fill="#1e4b6c" font-size="24" font-weight="400" text-anchor="start">Изменённые строки</text>
  <rect x="32" y="2536" width="296" height="120" rx="16" fill="#ffffff" stroke="#bfd6e9" stroke-width="1.5"/>
  <text x="48" y="2577" fill="#1e4b6c" font-size="26" font-weight="700" text-anchor="start">BSL</text>
  <text x="48" y="2616" fill="#1e4b6c" font-size="24" font-weight="400" text-anchor="start">Java + BSL-LS</text>
  <rect x="32" y="2672" width="296" height="152" rx="16" fill="#ffffff" stroke="#bfd6e9" stroke-width="1.5"/>
  <text x="48" y="2713" fill="#1e4b6c" font-size="26" font-weight="700" text-anchor="start">1С и тесты</text>
  <text x="48" y="2752" fill="#1e4b6c" font-size="24" font-weight="400" text-anchor="start">Платформа +</text>
  <text x="48" y="2784" fill="#1e4b6c" font-size="24" font-weight="400" text-anchor="start">профиль YAxUnit.</text>
  <text x="36" y="2870" fill="#365e7d" font-size="24" font-weight="400" text-anchor="start">Для BSL, платформы</text>
  <text x="36" y="2902" fill="#365e7d" font-size="24" font-weight="400" text-anchor="start">и тестов нужна</text>
  <text x="36" y="2934" fill="#365e7d" font-size="24" font-weight="400" text-anchor="start">настройка.</text>
  <rect x="16" y="3004" width="328" height="318" rx="20" fill="#f1eafb" stroke="#c4afe0" stroke-width="1.5"/>
  <text x="36" y="3046" fill="#4f3470" font-size="26" font-weight="800" text-anchor="start">Есть замечания?</text>
  <text x="36" y="3090" fill="#614b7b" font-size="24" font-weight="400" text-anchor="start">Вернитесь к шагу 4.</text>
  <text x="36" y="3122" fill="#614b7b" font-size="24" font-weight="400" text-anchor="start">Доработайте черновик</text>
  <text x="36" y="3154" fill="#614b7b" font-size="24" font-weight="400" text-anchor="start">новой ревизией.</text>
  <text x="36" y="3186" fill="#614b7b" font-size="24" font-weight="400" text-anchor="start">Проверьте её снова.</text>
  <text x="36" y="3234" fill="#614b7b" font-size="24" font-weight="400" text-anchor="start">Прежняя проверка —</text>
  <text x="36" y="3266" fill="#614b7b" font-size="24" font-weight="400" text-anchor="start">для прежнего текста.</text>
