# ─────────────────────────────────────────────────────────────────────────────
# 1С:Рентген — production compose for the actual product path.
#
# One app service (rentgen) built from Dockerfile.rentgen. Token-free, backed by
# the in-process SQLite store. NO Postgres / Neo4j / Redis / Qdrant — those are
# legacy/optional and not needed here.
#
# Prerequisites (operator-supplied, NOT committed):
#   1. A .env file in this directory containing at least:
#        JWT_SECRET=<strong-random-value>      # app refuses to boot on CHANGE_ME
#        OAUTH_ENCRYPTION_KEY=<strong-random-value>
#   2. The prebuilt database at ./data/rentgen.db (~371 MB) — bind-mounted
#      read-only; it is intentionally NOT baked into the image.
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml logs -f
#   docker compose -f docker-compose.prod.yml down
# ─────────────────────────────────────────────────────────────────────────────

services:
  rentgen:
    build:
      context: .
      dockerfile: Dockerfile.rentgen
    image: rentgen:latest
    container_name: rentgen
    # Secrets come from an operator-supplied .env (never committed). JWT_SECRET is
    # mandatory; the app exits if it is unset or left at the CHANGE_ME default.
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      # Prebuilt SQLite store, mounted read-only at the path the app resolves
      # (tools/rentgen/store.py -> <root>/data/rentgen.db, i.e. /app/data/rentgen.db).
      - ./data/rentgen.db:/app/data/rentgen.db:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  # ───────────────────────────────────────────────────────────────────────────
  # Optional: static front-end (portal/dist) served by nginx and reverse-proxying
  # /api to the rentgen service. Uncomment and provide an nginx.conf to enable.
  # ───────────────────────────────────────────────────────────────────────────
  # web:
  #   image: nginx:1.27-alpine
  #   container_name: rentgen-web
  #   depends_on:
  #     - rentgen
  #   ports:
  #     - "80:80"
