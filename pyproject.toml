[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "rentgen-core"
version = "0.1.0.dev8"
description = "Local 1C snapshots, shared draft history and pinned BSL diagnostics"
readme = "packaging/core/README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Operating System :: Microsoft :: Windows",
]

[project.scripts]
rentgen = "rentgen_core.cli:main"
rentgen-mcp = "rentgen_core.stdio_mcp:main"
rentgen-observer = "rentgen_core.observer_cli:main"

[project.optional-dependencies]
mcp = ["mcp==1.30.0"]

[tool.hatch.build]
ignore-vcs = true

[tool.hatch.build.targets.wheel]
only-include = ["rentgen_core", "rentgen_graph", "rentgen_diagnostics"]
exclude = ["__pycache__", "*.pyc", "*.pyo"]

dev-mode-exact = true

[tool.hatch.build.targets.sdist]
only-include = [
  "pyproject.toml",
  "LICENSE",
  "rentgen_core",
  "packaging/core",
  "rentgen_graph",
  "rentgen_diagnostics",
  "go/go.mod",
  "go/cmd",
  "go/internal",
  "go/pkg",
  "requirements-product-build.txt",
  "requirements/locks/product-build-py311-windows.txt",
  "requirements/locks/product-py311-windows.txt",
  "requirements/locks/mcp-py311-windows.txt",
  "scripts/release/build_core_kit.py",
  "scripts/verification/export_core_kit.py",
  "scripts/verification/verify_core_kit.py",
  "scripts/verification/core_kit_client.py",
  "scripts/verification/kit_inputs.py",
  "docs/product/CORE-INSTALLATION.md",
  "docs/product/CORE-OFFLINE-KIT.md",
  "docs/product/CORE-MCP.md",
  "docs/product/DRAFT-HISTORY.md",
  "docs/product/DRAFT-HISTORY-DESIGN.md",
  "docs/product/DRAFT-MCP.md",
  "docs/product/LARGE-DRAFT-MCP.md",
  "docs/product/DRAFT-EDITOR.md",
  "docs/product/PROJECT-DRAFTS-HTTP.md",
  "docs/product/SOURCE-DISCOVERY.md",
  "docs/product/WORKFLOW-STATE-ADR.md",
  "packaging/test-profiles/yaxunit-25.12/inputs.json",
  "packaging/test-profiles/yaxunit-25.12/ОшибкаЗаписи.bsl",
  "packaging/test-profiles/yaxunit-25.12/СохранитьДокумент.bsl",
  "scripts/verification/verify_yaxunit_platform.py",
  "scripts/verification/yaxunit_report.py",
  "docs/product/YAXUNIT-PLATFORM-PROFILE.md",
  "docs/product/evidence/yaxunit-25.12-platform.json",
  "docs/product/PROPOSAL-CHECK.md",
  "docs/product/PROPOSAL-PLATFORM-CHECK.md",
  "docs/product/STATE-MIGRATION.md",
  "docs/product/PROJECT-ACCESS.md",
  "docs/product/SNAPSHOT-METADATA.md",
  "docs/product/SNAPSHOT-READ-SESSIONS.md",
  "docs/product/SNAPSHOT-PUBLICATION-ADR.md",
  "docs/product/SNAPSHOT-DIFF.md",
  "docs/product/OBSERVER.md",
  "scripts/verification/verify_native_platform.py",
  "scripts/verification/verify_proposal_platform_delivery.py",
  "docs/product/PLATFORM-ACCEPTANCE.md",
  "docs/product/evidence/native-platform-8.3.27.2342.json",
]
exclude = ["__pycache__", "*.pyc", "*.pyo"]

[tool.hatch.build.targets.sdist.hooks.custom]
path = "packaging/core/hatch_build.py"
