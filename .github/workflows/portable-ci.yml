name: Experimental portable contracts

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: portable-contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux experimental contracts (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.python == '3.11' && 45 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
        include:
          - python: '3.11'
            runtime: '3.11.15'
          - python: '3.12'
            runtime: '3.12'
    env:
      PYTHONUTF8: '1'
      CARGO_BUILD_JOBS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.runtime }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.15.0'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.5'
          cache: false
      - name: Install exact Rust toolchain and Python test tools
        run: |
          rustup toolchain install 1.92.0 --profile minimal
          python -m pip install -r requirements-test.txt -r requirements-product-build.txt
          mkdir -p output
          python --version
          cargo +1.92.0 --version
      - name: Bound all collected pytest IDs before expensive qualification
        run: python -m pytest --collect-only -q
      - name: Test and build the owned static Linux scanner
        env:
          CGO_ENABLED: '0'
        run: |
          go -C go test -timeout 120s ./...
          go -C go build -trimpath -buildmode=exe -o "$GITHUB_WORKSPACE/output/bsl-scan-owned-linux" ./cmd/bsl-scan
          python - <<'PY'
          import hashlib, json, os, shutil, subprocess
          from pathlib import Path
          scanner = Path("output/bsl-scan-owned-linux").resolve(strict=True)
          digest = hashlib.sha256(scanner.read_bytes()).hexdigest()
          go_version = subprocess.check_output(["go", "version"], text=True).strip()
          assert go_version == "go version go1.25.5 linux/amd64", "Unexpected Go toolchain"
          goroot = Path(subprocess.check_output(["go", "env", "GOROOT"], text=True).strip())
          license_bytes = (goroot / "LICENSE").read_bytes()
          license_hash = hashlib.sha256(license_bytes).hexdigest()
          assert license_hash == "911f8f5782931320f5b8d1160a76365b83aea6447ee6c04fa6d5591467db9dad"
          Path("output/linux-scanner-GO-LICENSE").write_bytes(license_bytes)
          source_files = [Path("go/go.mod"), *sorted(Path("go").rglob("*.go"))]
          provenance = {
              "schema": "rentgen-owned-linux-scanner-build-observation/1",
              "protocol": "rentgen-owned-scanner-linux-v1",
              "source_commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "source_tree": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip(),
              "source_files_sha256": {str(path): hashlib.sha256(path.read_bytes()).hexdigest() for path in source_files},
              "go_version": go_version,
              "go_executable_sha256": hashlib.sha256(Path(shutil.which("go")).read_bytes()).hexdigest(),
              "cgo_enabled": False,
              "build_arguments": ["build", "-trimpath", "-buildmode=exe", "./cmd/bsl-scan"],
              "scanner": {"sha256": digest, "size_bytes": scanner.stat().st_size},
              "license": {"path": "licenses/GO-LICENSE", "sha256": license_hash, "size_bytes": len(license_bytes)},
              "scope": "CI build observation; installed acceptance is a separate receipt",
          }
          Path("output/linux-scanner-provenance.json").write_text(json.dumps(provenance, indent=2) + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              stream.write(f"RENTGEN_TEST_LINUX_SCANNER={scanner}\n")
              stream.write(f"RENTGEN_TEST_LINUX_SCANNER_SHA256={digest}\n")
          PY
      - name: Linux manual draft CLI and SDK contracts
        run: python -m pytest -q --tb=short tests/unit/test_draft_cli_contract.py tests/unit/test_linux_mcp_capture.py -k 'DraftCliContractTests or manual_draft_cli_and_sdk' --junitxml=output/linux-draft-contracts.xml
      - name: Locked Rust native and process contracts
        run: |
          cargo +1.92.0 test --locked --manifest-path rust/input-core/Cargo.toml
          cargo +1.92.0 build --locked --release --manifest-path rust/input-core/Cargo.toml
          cargo +1.92.0 test --locked --release --manifest-path rust/input-core/Cargo.toml --test sidecar
          cargo +1.92.0 test --locked --release --manifest-path rust/input-core/Cargo.toml --test sidecar absolute_session_deadline_terminates_partial_frame -- --ignored --exact
          echo "RENTGEN_INPUT_CORE_TEST_BINARY=$GITHUB_WORKSPACE/rust/input-core/target/release/rentgen-input-core" >> "$GITHUB_ENV"
      - name: Portable CLI MCP planners and real Rust acceptance
        run: |
          python -m pytest -q --tb=short tests/unit/test_portable_local_workflow.py tests/unit/test_rust_input_workflow.py tests/unit/test_metadata_materialize_cli.py tests/unit/test_edt_attribute_cli.py tests/unit/test_edt_identity_three_way_cli.py tests/unit/test_mcp_tool_annotations.py tests/unit/test_state_migration_contract.py tests/unit/test_core_dev16_compatibility.py tests/unit/test_linux_baseline_gate.py tests/unit/test_portable_gui_delivery.py --junitxml=output/portable-contracts.xml
      - name: Local graphical workspace HTTP Rust and frontend contracts
        run: |
          python -m pytest -q --tb=short tests/unit/test_local_gui.py tests/unit/test_local_gui_search.py tests/unit/test_local_gui_modules.py tests/unit/test_local_gui_pagination.py tests/unit/test_local_gui_comparison.py tests/unit/test_local_gui_source_search.py tests/unit/test_local_gui_search_comparison.py tests/unit/test_local_gui_report.py --junitxml=output/gui-contracts.xml
          node --test tests/gui/*.test.mjs > output/gui-js-tests.log
      - name: Diagnostic full Linux suite with known Windows baseline
        shell: bash
        run: |
          set +e
          python -m pytest -q --tb=short --junitxml=output/linux-diagnostic.xml > output/linux-diagnostic.log 2>&1
          status=$?
          set -e
          python scripts/verification/check_linux_baseline.py --junit output/linux-diagnostic.xml --baseline docs/product/evidence/linux-baseline-classification-20261005.json --pytest-exit "$status" --output output/linux-baseline-comparison.json
      - name: Build candidate Python artifacts and verify installed Rust CLI and GUI
        run: |
          python -m build --no-isolation --wheel --outdir output/direct-wheel
          python -m build --no-isolation
          version=$(python -c 'import pathlib,tomllib;print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')
          cmp "output/direct-wheel/rentgen_core-$version-py3-none-any.whl" "dist/rentgen_core-$version-py3-none-any.whl"
          sha256sum "dist/rentgen_core-$version-py3-none-any.whl" > output/wheel-reproducibility.sha256
          python scripts/verification/verify_portable_delivery.py --wheel "dist/rentgen_core-$version-py3-none-any.whl" --binary "$RENTGEN_INPUT_CORE_TEST_BINARY" --output output/installed-portable --expected-version "$version"
          python scripts/verification/verify_linux_capture_delivery.py --wheel "dist/rentgen_core-$version-py3-none-any.whl" --scanner "$RENTGEN_TEST_LINUX_SCANNER" --scanner-sha256 "$RENTGEN_TEST_LINUX_SCANNER_SHA256" --output output/installed-linux-capture --expected-version "$version" --source-commit "$(git rev-parse HEAD)"
          mkdir -p output/experimental-linux
          cp "$RENTGEN_INPUT_CORE_TEST_BINARY" output/experimental-linux/rentgen-input-core
          cp "$RENTGEN_TEST_LINUX_SCANNER" output/experimental-linux/bsl-scan-owned-linux
          cp LICENSE rust/input-core/README.md rust/input-core/PROTOCOL.md rust/input-core/THIRD_PARTY_NOTICES.md rust/input-core/DEPENDENCY_PROVENANCE.json output/experimental-linux/
          cp -r rust/input-core/licenses output/experimental-linux/licenses
          cp output/linux-scanner-GO-LICENSE output/experimental-linux/licenses/GO-LICENSE
          cp output/linux-scanner-provenance.json output/experimental-linux/GO-SCANNER-PROVENANCE.json
          sha256sum output/experimental-linux/rentgen-input-core > output/experimental-linux/SHA256SUMS
          sha256sum output/experimental-linux/bsl-scan-owned-linux >> output/experimental-linux/SHA256SUMS
      - name: Acquire exact owned Linux SDK wheels (online input acquisition)
        if: matrix.python == '3.11'
        timeout-minutes: 5
        run: |
          python - <<'PY'
          import importlib.util, os, subprocess, sys
          from pathlib import Path
          assert sys.platform == "linux" and sys.implementation.name == "cpython"
          assert sys.version_info[:3] == (3, 11, 15), "Owned SDK profile requires CPython 3.11.15"
          source = Path("requirements/locks/check_linux_mcp_lock.py")
          spec = importlib.util.spec_from_file_location("owned_sdk_lock", source)
          checker = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(checker)
          checker.load_inputs()  # Exact committed lock, target, origins and closure, before network IO.
          wheelhouse = Path("output/owned-linux-wheelhouse")
          wheelhouse.mkdir(mode=0o700, exist_ok=False)
          command = [sys.executable, "-I", "-m", "pip", "--isolated", "--disable-pip-version-check",
              "--no-cache-dir", "download", "--index-url", "https://pypi.org/simple",
              "--require-hashes", "--only-binary=:all:", "--no-deps",
              "--implementation", "cp", "--python-version", "3.11.15",
              "--abi", "cp311", "--abi", "abi3", "--abi", "none"]
          # Explicit glibc ceiling, independent of the runner's newer glibc tags.
          for platform in [f"manylinux_2_{n}_x86_64" for n in range(34, 4, -1)] + [
                  "manylinux2014_x86_64", "manylinux2010_x86_64", "manylinux1_x86_64"]:
              command += ["--platform", platform]
          command += ["--dest", str(wheelhouse), "-r", "requirements/locks/mcp-py311-linux-x86_64.txt"]
          subprocess.run(command, check=True, timeout=240)
          checked = checker.verify_wheelhouse(wheelhouse)
          assert len(checked["wheels"]) == 29, "Expected the exact 29-wheel SDK closure"
          assert sum(item["size_bytes"] for item in checked["wheels"]) <= 16 * 1024**2
          # Input parsing and online acquisition are not installed/native qualification.
          PY
      - name: Export a separate owned Linux CLI and MCP candidate
        if: matrix.python == '3.11'
        timeout-minutes: 3
        run: |
          python - <<'PY'
          import hashlib, importlib.util, json, os, stat, subprocess, sys, tomllib
          from pathlib import Path
          assert sys.version_info[:3] == (3, 11, 15)
          root = Path.cwd().resolve(strict=True)
          source = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          tree = subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip()
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          spec = importlib.util.spec_from_file_location("owned_kit_exporter", "scripts/release/prepare_owned_linux.py")
          exporter = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(exporter)
          # Reuse the plain copies made by the preceding installed-CLI step.
          # Strict nlink=1 remains mandatory; never chmod or rewrite producer aliases.
          # The exporter independently reopens and verifies every pinned input.
          def record(component, path, asset, limit=exporter.MAX_FILE):
              path = Path(os.path.abspath(path))
              with exporter.OwnedDirectory(path.parent) as parent:
                  before = os.stat(path.name, dir_fd=parent.fd, follow_symlinks=False)
                  if not stat.S_ISREG(before.st_mode) or before.st_nlink != 1:
                      kinds = {stat.S_IFREG: "regular", stat.S_IFDIR: "directory", stat.S_IFLNK: "symlink",
                          stat.S_IFIFO: "fifo", stat.S_IFSOCK: "socket", stat.S_IFCHR: "character", stat.S_IFBLK: "block"}
                      raise ValueError("Owned Linux input refused: " + json.dumps(dict(component=component,
                          object_type=kinds.get(stat.S_IFMT(before.st_mode), "other"),
                          link_count=before.st_nlink, size_bytes=before.st_size), sort_keys=True))
                  assert 0 < before.st_size <= limit, component + ': input size budget'
                  descriptor = os.open(path.name, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK, dir_fd=parent.fd)
                  try:
                      assert exporter._stamp(os.fstat(descriptor)) == exporter._stamp(before)
                      content = bytearray()
                      while True:
                          block = os.read(descriptor, 65536)
                          if not block:
                              break
                          content.extend(block)
                          assert len(content) <= limit, component + ': input size budget'
                      assert exporter._stamp(os.fstat(descriptor)) == exporter._stamp(before)
                      assert exporter._stamp(os.stat(path.name, dir_fd=parent.fd, follow_symlinks=False)) == exporter._stamp(before)
                      assert len(content) == before.st_size
                  finally:
                      os.close(descriptor)
              return dict(asset=asset, sha256=hashlib.sha256(content).hexdigest(), size_bytes=len(content))
          paths = {
              "wheel": root / "dist" / f"rentgen_core-{version}-py3-none-any.whl",
              "scanner": root / "output/experimental-linux/bsl-scan-owned-linux",
              "scanner_license": root / "output/experimental-linux/licenses/GO-LICENSE",
              "scanner_provenance": root / "output/experimental-linux/GO-SCANNER-PROVENANCE.json",
              "rust_helper": root / "output/experimental-linux/rentgen-input-core",
          }
          assets = {"wheel": f"rentgen_core-{version}-py3-none-any.whl", "scanner": "bsl-scan-owned-linux",
              "scanner_license": "GO-LICENSE", "scanner_provenance": "go-scanner-build-inputs.json",
              "rust_helper": "rentgen-input-core"}
          inputs = dict(schema=1, profile=exporter.PROFILE, version=version, source_commit=source, source_tree=tree)
          inputs.update({name: record(name, path, assets[name]) for name, path in paths.items()})
          assert inputs["scanner"]["sha256"] == os.environ["RENTGEN_TEST_LINUX_SCANNER_SHA256"]
          exporter.validate_inputs(inputs)
          # Bind these existing staged copies to the exact bytes exercised in step 13.
          def prior_receipt(component, relative):
              path = root / relative
              pin = record(component, path, path.name, exporter.MAX_JSON)
              raw = exporter.read_pinned(path, {key: pin[key] for key in ("sha256", "size_bytes")}, limit=exporter.MAX_JSON)
              return exporter.parse_json(raw)
          portable = prior_receipt("installed_cli_receipt", "output/installed-portable/acceptance.json")
          capture = prior_receipt("installed_capture_receipt", "output/installed-linux-capture/acceptance.json")
          assert (portable["schema"] == 1 and portable["version"] == version
              and portable["source_unchanged"] is True and portable["project_head_unchanged"] is True
              and capture["schema"] == 1 and capture["version"] == version
              and capture["source_commit"] == source and capture["source_tree"] == tree
              and capture["isolated_installed_core_and_graph"] is True
              and capture["installed_product_bytes_equal_checkout"] is True), "Prior installed receipt binding differs"
          assert portable["wheel_sha256"] == inputs["wheel"]["sha256"], "Previously installed Core wheel differs"
          assert portable["binary_sha256"] == inputs["rust_helper"]["sha256"], "Previously exercised Rust helper differs"
          for name in ("wheel", "scanner"):
              assert {key: inputs[name][key] for key in ("sha256", "size_bytes")} == {
                  key: capture[name][key] for key in ("sha256", "size_bytes")}, "Previously exercised " + name + " differs"
          private = Path("output/owned-linux-inputs")
          private.mkdir(mode=0o700, exist_ok=False)
          input_path = private / "build-inputs.json"
          with input_path.open("xb") as stream:
              stream.write(exporter.json_bytes(inputs))
          input_path.chmod(0o600)
          candidate = Path("output/owned-linux-candidate")
          command = [sys.executable, "-I", "scripts/release/prepare_owned_linux.py", "build",
              "--inputs", str(input_path), "--inputs-sha256", exporter.sha(input_path.read_bytes()),
              "--wheelhouse", "output/owned-linux-wheelhouse", "--output", str(candidate)]
          for name, path in paths.items():
              command += ["--" + name.replace("_", "-"), str(path)]
          subprocess.run(command, check=True, timeout=150)
          manifest_path = candidate / exporter.MANIFEST
          manifest = exporter.parse_json(manifest_path.read_bytes())
          assert manifest["inputs"] == inputs and manifest["kind"] == exporter.PROFILE
          values = {
              "OWNED_LINUX_VERSION": version, "OWNED_LINUX_SOURCE": source, "OWNED_LINUX_TREE": tree,
              "OWNED_LINUX_ARCHIVE": str(candidate / manifest["asset"]),
              "OWNED_LINUX_MANIFEST": str(manifest_path),
              "OWNED_LINUX_ARCHIVE_SHA256": manifest["sha256"],
              "OWNED_LINUX_MANIFEST_SHA256": exporter.sha(manifest_path.read_bytes()),
              "OWNED_LINUX_SCANNER_SHA256": inputs["scanner"]["sha256"],
              "OWNED_LINUX_RUST_SHA256": inputs["rust_helper"]["sha256"],
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              for name, value in values.items():
                  assert "\n" not in value and "\r" not in value
                  stream.write(name + "=" + value + "\n")
          PY
      - name: Verify final owned Linux archive through installed CLI and official SDK offline
        if: matrix.python == '3.11'
        timeout-minutes: 10
        run: |
          python scripts/verification/verify_owned_linux_delivery.py \
            --archive "$OWNED_LINUX_ARCHIVE" --manifest "$OWNED_LINUX_MANIFEST" \
            --archive-sha256 "$OWNED_LINUX_ARCHIVE_SHA256" --manifest-sha256 "$OWNED_LINUX_MANIFEST_SHA256" \
            --output output/installed-owned-linux --expected-version "$OWNED_LINUX_VERSION" \
            --source-commit "$OWNED_LINUX_SOURCE" --scanner-sha256 "$OWNED_LINUX_SCANNER_SHA256" \
            --rust-sha256 "$OWNED_LINUX_RUST_SHA256"
      - name: Bound the four public owned Linux candidate files
        if: matrix.python == '3.11'
        timeout-minutes: 2
        run: |
          python - <<'PY'
          import hashlib, importlib.util, json, os, re, stat
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("owned_kit_exporter", "scripts/release/prepare_owned_linux.py")
          exporter = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(exporter)
          candidate = Path("output/owned-linux-candidate")
          manifest_path = Path(os.environ["OWNED_LINUX_MANIFEST"])
          archive_path = Path(os.environ["OWNED_LINUX_ARCHIVE"])
          def pinned(path, expected, limit):
              with exporter.OwnedDirectory(path.parent) as parent:
                  size = os.stat(path.name, dir_fd=parent.fd, follow_symlinks=False).st_size
                  return parent.read(path.name, dict(sha256=expected, size_bytes=size), limit=limit)
          manifest_raw = pinned(manifest_path, os.environ["OWNED_LINUX_MANIFEST_SHA256"], 1024**2)
          manifest = exporter.parse_json(manifest_raw)
          archive_raw = pinned(archive_path, os.environ["OWNED_LINUX_ARCHIVE_SHA256"], 64 * 1024**2)
          exporter.verified_payload(archive_raw, manifest)
          expected_files = {manifest["asset"], exporter.MANIFEST, exporter.CHECKSUMS}
          with exporter.OwnedDirectory(candidate) as directory:
              assert set(os.listdir(directory.fd)) == expected_files
          checksum_expected = (exporter.sha(archive_raw) + "  " + manifest["asset"] + "\n"
              + exporter.sha(manifest_raw) + "  " + exporter.MANIFEST + "\n").encode()
          checksum = pinned(candidate / exporter.CHECKSUMS, exporter.sha(checksum_expected), 1024)
          receipt_path = Path("output/installed-owned-linux/acceptance.json")
          with exporter.OwnedDirectory(receipt_path.parent) as directory:
              info = os.stat(receipt_path.name, dir_fd=directory.fd, follow_symlinks=False)
              assert stat.S_ISREG(info.st_mode) and info.st_nlink == 1 and 0 < info.st_size <= 1024**2
              # The verifier created this file in this job. Freeze the observed
              # bytes and compare the owned copy before public staging.
              descriptor = os.open(receipt_path.name, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK, dir_fd=directory.fd)
              try:
                  assert exporter._stamp(os.fstat(descriptor)) == exporter._stamp(info)
                  content = bytearray()
                  while True:
                      block = os.read(descriptor, 65536)
                      if not block:
                          break
                      content.extend(block)
                      assert len(content) <= 1024**2
                  assert exporter._stamp(os.fstat(descriptor)) == exporter._stamp(info)
                  assert exporter._stamp(os.stat(receipt_path.name, dir_fd=directory.fd, follow_symlinks=False)) == exporter._stamp(info)
                  assert len(content) == info.st_size
                  receipt_raw = bytes(content)
              finally:
                  os.close(descriptor)
              receipt_raw = directory.read(receipt_path.name,
                  dict(sha256=exporter.sha(receipt_raw), size_bytes=info.st_size), limit=1024**2)
          receipt = exporter.parse_json(receipt_raw)
          assert receipt["schema"] == 1 and receipt["profile"] == exporter.PROFILE
          assert receipt["candidate"] is True and receipt["release_authority"] is False
          assert receipt["source_commit"] == os.environ["OWNED_LINUX_SOURCE"]
          assert receipt["source_tree"] == os.environ["OWNED_LINUX_TREE"]
          assert receipt["version"] == os.environ["OWNED_LINUX_VERSION"]
          for section, raw in (("archive", archive_raw), ("manifest", manifest_raw)):
              assert receipt[section] == dict(sha256=exporter.sha(raw), size_bytes=len(raw))
          assert receipt["scanner"]["sha256"] == os.environ["OWNED_LINUX_SCANNER_SHA256"]
          assert receipt["rust_helper"]["sha256"] == os.environ["OWNED_LINUX_RUST_SHA256"]
          assert receipt["rust_helper"]["executed"] is False
          assert len(receipt["sdk_wheels"]) == 29
          assert receipt["runtime"]["python"] == "3.11.15"
          assert receipt["offline_install"] == dict(no_index=True, require_hashes=True, binary_only=True,
              pip_check=True, bootstrap_and_core_unchanged=True)
          assert receipt["sdk"]["schema"] == 1 and receipt["sdk"]["accepted"] is True
          def public(value):
              if isinstance(value, dict):
                  for key, item in value.items():
                      public(key); public(item)
              elif isinstance(value, list):
                  for item in value:
                      public(item)
              elif isinstance(value, str):
                  assert not value.startswith(("/", "file:")) and not re.match(r"[A-Za-z]:[\\/]", value)
                  assert all(private not in value for private in (
                      str(Path.cwd()), os.environ.get("RUNNER_TEMP", "/__unused__"), "/Users/", "/home/runner/"))
          public(receipt)
          files = {manifest["asset"]: archive_raw, exporter.MANIFEST: manifest_raw,
              exporter.CHECKSUMS: checksum, "owned-linux-acceptance.json": receipt_raw}
          assert sum(map(len, files.values())) <= 64 * 1024**2
          with exporter.OwnedDirectory("output/owned-linux-public", create=True) as directory:
              for name, raw in sorted(files.items()):
                  directory.write(name, raw)
                  directory.read(name, dict(sha256=exporter.sha(raw), size_bytes=len(raw)), limit=64 * 1024**2)
              assert set(os.listdir(directory.fd)) == set(files)
          PY
      - name: Upload separate owned Linux candidate and scoped acceptance
        if: success() && matrix.python == '3.11'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: owned-linux-cli-mcp-py311-x86_64-v1
          path: output/owned-linux-public/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload scoped evidence and development artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: experimental-linux-python-${{ matrix.python }}
          path: |
            output/portable-contracts.xml
            output/linux-draft-contracts.xml
            output/gui-contracts.xml
            output/gui-js-tests.log
            output/linux-diagnostic.xml
