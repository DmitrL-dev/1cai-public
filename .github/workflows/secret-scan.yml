name: Secret Scan

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # еженедельно

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          config-path: ''
          args: "--redact --verbose"
