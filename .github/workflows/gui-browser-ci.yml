name: Linux GUI browser acceptance

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: gui-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-gui-browser:
    name: Linux GUI real browser and 200% zoom
    # Ubuntu 22.04 supports the ordinary unprivileged Chromium sandbox.
    # Do not relax AppArmor, sysctl or sandbox flags on a restricted runner.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '2'
      PYTHONUTF8: '1'
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      RENTGEN_INPUT_CORE_TEST_BINARY: ${{ github.workspace }}/rust/input-core/target/release/rentgen-input-core
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11.9'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.15.0'
      - name: Install locked test-only tools without elevation
        run: |
          test "$(id -u)" -ne 0
          rustup toolchain install 1.92.0 --profile minimal
          python -m pip install -r requirements-test.txt
          npm ci --prefix tests/gui/browser --ignore-scripts
          cd tests/gui/browser
          npx --no-install playwright install chromium
      - name: Build actual Rust input core
        run: cargo +1.92.0 build --locked --release --manifest-path rust/input-core/Cargo.toml
      - name: Existing transport, authorization and Rust contracts
        run: |
          mkdir -p output/gui-browser
          python -m pytest -q tests/unit/test_local_gui.py tests/unit/test_local_gui_search.py tests/unit/test_local_gui_modules.py tests/unit/test_rust_input_workflow.py --junitxml=output/gui-browser/backend.xml
          node --test tests/gui/*.test.mjs > output/gui-browser/model.log
      - name: Run real sandboxed browser acceptance
        run: npm --prefix tests/gui/browser test
      - name: Verify all thirteen browser gates ran and record exact checkout
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess, xml.etree.ElementTree as ET
          output = pathlib.Path('output/gui-browser')
          cases = ET.parse(output / 'junit.xml').findall('.//testcase')
          assert len(cases) == 13, 'All thirteen browser acceptance cases must run'
          assert all(not any(c.find(tag) is not None for tag in ('failure', 'error', 'skipped')) for c in cases)
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == os.environ['EXPECTED_HEAD']
          binary = pathlib.Path(os.environ['RENTGEN_INPUT_CORE_TEST_BINARY'])
          receipt = {'status': 'passed', 'checkout_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'workflow_sha': os.environ['GITHUB_SHA'], 'input_core_sha256': hashlib.sha256(binary.read_bytes()).hexdigest(), 'browser_cases': len(cases), 'synthetic_inputs_only': True, 'sandbox_enabled': True, 'host': '127.0.0.1'}
          (output / 'acceptance.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
      - name: Upload bounded synthetic evidence only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-gui-browser-evidence
          path: |
            output/gui-browser/junit.xml
            output/gui-browser/backend.xml
            output/gui-browser/model.log
            output/gui-browser/acceptance.json
            output/gui-browser/results/**/*.png
            output/gui-browser/results/**/*.json
          if-no-files-found: warn
          retention-days: 14
