name: Product checks

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: product-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11.9'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.15.0'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.5'
          cache: false
      - name: Install test tools
        run: python -m pip install -r requirements-test.txt
      - name: Python contracts
        env:
          PYTHONUTF8: '1'
        run: python -m pytest -q --tb=short
      - name: Companion contracts
        run: node --test integrations/vscode-rentgen/test/*.test.cjs
      - name: Scanner tests
        run: go -C go test ./...
      - name: Verify accepted companion
        run: python scripts/release/prepare_companion.py build --tag companion-v0.1.4 --output release-assets
