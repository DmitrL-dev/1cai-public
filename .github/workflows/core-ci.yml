name: Product checks

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: product-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11.9'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.15.0'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.5'
          cache: false
      - name: Install test tools
        run: python -m pip install -r requirements-test.txt
      - name: Python contracts
        env:
          PYTHONUTF8: '1'
        run: python -m pytest -q --tb=short
      - name: Companion contracts
        run: node --test integrations/vscode-rentgen/test/*.test.cjs
      - name: Scanner tests
        run: go -C go test ./...
      - name: Verify accepted companion
        run: python scripts/release/prepare_companion.py build --tag companion-v0.1.4 --output release-assets
      - name: Build core with pinned tools
        run: |
          python -m venv .venv-build
          .\.venv-build\Scripts\python.exe -m pip install --require-hashes --only-binary=:all: -r requirements/locks/product-build-py311-windows.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv-build\Scripts\python.exe -m build --no-isolation --outdir output/dist
      - name: Verify installed snapshot comparison
        run: |
          go -C go build -buildvcs=false -trimpath -o ..\output\bsl-scan.exe ./cmd/bsl-scan
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m venv .venv-delivery
          .\.venv-delivery\Scripts\python.exe -m pip install --no-index --no-deps output/dist/rentgen_core-0.1.0.dev8-py3-none-any.whl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv-delivery\Scripts\python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verification/verify_snapshot_diff_delivery.py --python .venv-delivery/Scripts/python.exe --scanner output/bsl-scan.exe --output output/verification
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verified-core-development
          path: |
            output/dist/*.whl
            output/dist/*.tar.gz
            output/verification/acceptance.json
          if-no-files-found: error
          retention-days: 14
