name: Product checks

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: product-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11.9'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.15.0'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.5'
          cache: false
      - name: Install test tools
        run: python -m pip install -r requirements-test.txt
      - name: Python contracts
        id: python_contracts
        env:
          PYTHONUTF8: '1'
        run: |
          New-Item -ItemType Directory -Force output | Out-Null
          python -m pytest -q --tb=short tests/unit/test_runtime_pins.py tests/unit/test_owned_attempt.py tests/unit/test_service_scm_delivery.py --junitxml=output/python-contracts.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q --tb=short --junitxml=output/python-contracts.xml
      - name: Upload Python contract report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-contract-report
          path: output/python-contracts.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Annotate Python contract failures
        if: always()
        env:
          PYTHON_CONTRACTS_OUTCOME: ${{ steps.python_contracts.outcome }}
        shell: pwsh
        run: |
          if ($env:PYTHON_CONTRACTS_OUTCOME -ne 'failure') { exit 0 }
          if (-not (Test-Path output/python-contracts.xml)) { exit 0 }
          [xml]$report = Get-Content output/python-contracts.xml
          $failed = @($report.SelectNodes('//testcase[failure or error]'))
          foreach ($case in $failed) {
            $class = [string]$case.classname
            $name = [string]$case.name
            $message = "$class::$name"
            $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Python contract failure::$message"
          }
          if ($failed.Count -eq 0) {
            Write-Output '::error title=Python contracts::Pytest exited non-zero without a testcase failure in JUnit'
          }
      - name: Companion contracts
        run: node --test integrations/vscode-rentgen/test/*.test.cjs scripts/verification/companion_host/*.test.cjs
      - name: Scanner tests
        run: go -C go test ./...
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: dc61e2ce16f5010b42fb61ae525f644a57b0ab08
          path: output/accepted-companion
          persist-credentials: false
      - name: Verify accepted companion
        working-directory: output/accepted-companion
        run: python scripts/release/prepare_companion.py build --tag companion-v0.1.4 --output release-assets
      - name: Build development companion
        run: python integrations/vscode-rentgen/build.py --output output/rentgen-companion-0.1.17-development.vsix
      - name: Build reproducible kit and verify offline CLI and MCP
        run: |
          python -m pip download --require-hashes --only-binary=:all: -r requirements/locks/mcp-py311-windows.txt --dest output/mcp-wheels
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip download --require-hashes --only-binary=:all: -r requirements/locks/product-build-py311-windows.txt --dest output/build-wheels
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/release/build_core_kit.py --output output/core-kit --runtime-wheelhouse output/mcp-wheels --build-wheelhouse output/build-wheels
      - name: Verify installed snapshot comparison
        run: python scripts/verification/verify_snapshot_diff_delivery.py --python output/core-kit/offline-install/environment/Scripts/python.exe --scanner output/core-kit/rentgen-core-0.1.0.dev16-windows-py311/bsl-scan.exe --output output/verification
      - name: Verify installed observer across processes
        run: python scripts/verification/verify_observer_delivery.py --python output/core-kit/offline-install/environment/Scripts/python.exe --scanner output/core-kit/rentgen-core-0.1.0.dev16-windows-py311/bsl-scan.exe --output output/observer-verification
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verified-core-development
          path: |
            output/core-kit/rentgen-core-0.1.0.dev16-windows-py311.zip
            output/core-kit/acceptance.json
            output/core-kit/offline-install/acceptance.json
            output/verification/acceptance.json
            output/observer-verification/acceptance.json
            output/rentgen-companion-0.1.17-development.vsix
          if-no-files-found: error
          retention-days: 14

  native-scm:
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11.9'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: verified-core-development
          path: output/scm-input
      - name: Prepare native SCM evidence directory
        id: scm_paths
        shell: pwsh
        run: |
          $name = 'rg-scm-' + [guid]::NewGuid().ToString('N').Substring(0, 12)
          $work = Join-Path $env:RUNNER_TEMP $name
          "work=$work" >> $env:GITHUB_OUTPUT
      - name: Verify native LocalService lifecycle and cleanup
        env:
          SCM_WORKDIR: ${{ steps.scm_paths.outputs.work }}
          PYTHONUTF8: '1'
        shell: pwsh
        run: |
          $kits = @(Get-ChildItem -LiteralPath output/scm-input/core-kit -Filter 'rentgen-core-*-windows-py311.zip' -File)
          if ($kits.Count -ne 1) { throw 'Expected one verified Core kit' }
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verification/verify_service_scm_delivery.py --kit $kits[0].FullName --build-receipt output/scm-input/core-kit/acceptance.json --expected-commit $commit --output $env:SCM_WORKDIR --run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload native SCM evidence
        if: always() && steps.scm_paths.outputs.work != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-scm-evidence
          path: ${{ steps.scm_paths.outputs.work }}/evidence/
          if-no-files-found: warn
          retention-days: 14

  native-git-diagnostic:
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11.9'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: verified-core-development
          path: output/git-scm-input
      - name: Prepare owned Git diagnostic evidence directory
        id: git_scm_paths
        shell: pwsh
        run: |
          $name = 'rg-scm-' + [guid]::NewGuid().ToString('N').Substring(0, 12)
          $work = Join-Path $env:RUNNER_TEMP $name
          "work=$work" >> $env:GITHUB_OUTPUT
      - name: Measure actual LocalService Git ownership and availability
        env:
          SCM_WORKDIR: ${{ steps.git_scm_paths.outputs.work }}
          PYTHONUTF8: '1'
        shell: pwsh
        run: |
          $kits = @(Get-ChildItem -LiteralPath output/git-scm-input/core-kit -Filter 'rentgen-core-*-windows-py311.zip' -File)
          if ($kits.Count -ne 1) { throw 'Expected one verified Core kit' }
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verification/verify_git_scm_diagnostic.py --kit $kits[0].FullName --build-receipt output/git-scm-input/core-kit/acceptance.json --expected-commit $commit --output $env:SCM_WORKDIR --run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload actual Git diagnostic evidence
        if: always() && steps.git_scm_paths.outputs.work != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-git-diagnostic-evidence
          path: ${{ steps.git_scm_paths.outputs.work }}/evidence/
          if-no-files-found: warn
          retention-days: 14

  native-stock-git:
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11.9'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: verified-core-development
          path: output/stock-scm-input
      - name: Prepare owned stock SCM and runtime input directories
        id: stock_scm_paths
        shell: pwsh
        run: |
          $nonce = [guid]::NewGuid().ToString('N').Substring(0, 12)
          $work = Join-Path $env:RUNNER_TEMP ('rg-scm-' + $nonce)
          $inputs = Join-Path $env:RUNNER_TEMP ('rg-bsl-' + $nonce)
          if ((Test-Path -LiteralPath $work) -or (Test-Path -LiteralPath $inputs)) { throw 'Owned attempt must be new' }
          New-Item -ItemType Directory -Path (Join-Path $inputs 'evidence') | Out-Null
          "work=$work" >> $env:GITHUB_OUTPUT
          "inputs=$inputs" >> $env:GITHUB_OUTPUT
      - name: Acquire and verify pinned BSL runtime inputs
        env:
          STOCK_RUNTIME_INPUTS: ${{ steps.stock_scm_paths.outputs.inputs }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = $env:STOCK_RUNTIME_INPUTS
          $archive = Join-Path $folder 'jdk.zip'
          $jar = Join-Path $folder 'bsl-language-server.jar'
          $receipt = [ordered]@{ schema = 1; java_warmup = $false; downloaded = $false; hashes_verified = $false; error = $null }
          try {
            Invoke-WebRequest -Uri 'https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.12.1%2B1/OpenJDK21U-jdk_x64_windows_hotspot_21.0.12.1_1.zip' -OutFile $archive
            Invoke-WebRequest -Uri 'https://github.com/1c-syntax/bsl-language-server/releases/download/v1.0.5/bsl-language-server-1.0.5-exec.jar' -OutFile $jar
            $receipt.downloaded = $true
            $receipt.java_archive_size = (Get-Item -LiteralPath $archive).Length
            $receipt.jar_size = (Get-Item -LiteralPath $jar).Length
            $receipt.java_archive_sha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            $receipt.jar_sha256 = (Get-FileHash -LiteralPath $jar -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($receipt.java_archive_size -ne 205073461 -or $receipt.java_archive_sha256 -ne 'f9d6e191ab098c0d416e7d588a24420a8621cd2f4720dab2459b8b7b2d2d8b4e') { throw 'Pinned Java archive differs' }
            if ($receipt.jar_size -ne 131962428 -or $receipt.jar_sha256 -ne 'de97f571e6474c5c151cf859294f589ee01152de3b4826b43e1a80b69ee2602a') { throw 'Pinned BSL JAR differs' }
            $receipt.hashes_verified = $true
            $unpacked = Join-Path $folder 'unpacked'
            Expand-Archive -LiteralPath $archive -DestinationPath $unpacked
            $roots = @(Get-ChildItem -LiteralPath $unpacked -Directory)
            if ($roots.Count -ne 1 -or -not (Test-Path -LiteralPath (Join-Path $roots[0].FullName 'bin/java.exe') -PathType Leaf)) { throw 'Expected one pinned JDK root' }
            $receipt.java_home = $roots[0].FullName
            $receipt.jar = $jar
            "STOCK_JAVA_HOME=$($roots[0].FullName)" >> $env:GITHUB_ENV
            "STOCK_BSL_JAR=$jar" >> $env:GITHUB_ENV
          } catch {
            $receipt.error = $_.Exception.Message
            throw
          } finally {
            $receipt | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $folder 'evidence/runtime-inputs.json') -Encoding utf8
          }
      - name: Qualify actual stock LocalService Git and native BSL lifecycle
        env:
          SCM_WORKDIR: ${{ steps.stock_scm_paths.outputs.work }}
          PYTHONUTF8: '1'
        shell: pwsh
        run: |
          $kits = @(Get-ChildItem -LiteralPath output/stock-scm-input/core-kit -Filter 'rentgen-core-*-windows-py311.zip' -File)
          if ($kits.Count -ne 1) { throw 'Expected one verified Core kit' }
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verification/verify_stock_git_scm.py --kit $kits[0].FullName --build-receipt output/stock-scm-input/core-kit/acceptance.json --expected-commit $commit --output $env:SCM_WORKDIR --java-home $env:STOCK_JAVA_HOME --jar $env:STOCK_BSL_JAR --run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload stock Git and BSL evidence including cold failures
        if: always() && steps.stock_scm_paths.outputs.work != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-stock-git-evidence
          path: |
            ${{ steps.stock_scm_paths.outputs.work }}/evidence/
            ${{ steps.stock_scm_paths.outputs.inputs }}/evidence/
          if-no-files-found: warn
          retention-days: 14
