name: Product checks

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: product-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11.9'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.15.0'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.5'
          cache: false
      - name: Install test tools
        run: python -m pip install -r requirements-test.txt
      - name: Python contracts
        env:
          PYTHONUTF8: '1'
        run: python -m pytest -q --tb=short
      - name: Companion contracts
        run: node --test integrations/vscode-rentgen/test/*.test.cjs
      - name: Scanner tests
        run: go -C go test ./...
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: dc61e2ce16f5010b42fb61ae525f644a57b0ab08
          path: output/accepted-companion
          persist-credentials: false
      - name: Verify accepted companion
        working-directory: output/accepted-companion
        run: python scripts/release/prepare_companion.py build --tag companion-v0.1.4 --output release-assets
      - name: Build development companion
        run: python integrations/vscode-rentgen/build.py --output output/rentgen-companion-0.1.6-development.vsix
      - name: Build reproducible kit and verify offline CLI and MCP
        run: |
          python -m pip download --require-hashes --only-binary=:all: -r requirements/locks/mcp-py311-windows.txt --dest output/mcp-wheels
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip download --require-hashes --only-binary=:all: -r requirements/locks/product-build-py311-windows.txt --dest output/build-wheels
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/release/build_core_kit.py --output output/core-kit --runtime-wheelhouse output/mcp-wheels --build-wheelhouse output/build-wheels
      - name: Verify installed snapshot comparison
        run: python scripts/verification/verify_snapshot_diff_delivery.py --python output/core-kit/offline-install/environment/Scripts/python.exe --scanner output/core-kit/rentgen-core-0.1.0.dev8-windows-py311/bsl-scan.exe --output output/verification
      - name: Verify installed observer across processes
        run: python scripts/verification/verify_observer_delivery.py --python output/core-kit/offline-install/environment/Scripts/python.exe --scanner output/core-kit/rentgen-core-0.1.0.dev8-windows-py311/bsl-scan.exe --output output/observer-verification
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verified-core-development
          path: |
            output/core-kit/rentgen-core-0.1.0.dev8-windows-py311.zip
            output/core-kit/acceptance.json
            output/core-kit/offline-install/acceptance.json
            output/verification/acceptance.json
            output/observer-verification/acceptance.json
            output/rentgen-companion-0.1.6-development.vsix
          if-no-files-found: error
          retention-days: 14
