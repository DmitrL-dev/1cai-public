name: Experimental diagnostic kernel contracts

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: diagnostic-contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Synthetic Rust contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.92.0 --profile minimal
      - name: Locked synthetic contracts and public wire regression
        shell: bash
        run: cargo +1.92.0 test --locked -j 1 --manifest-path rust/diagnostic-core/Cargo.toml -- --test-threads=1

  broker-policies:
    name: Synthetic broker and policy comparison (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11.9'
      - name: Install isolated pinned framework test dependencies
        run: python -m pip install --require-hashes -r tools/diagnostic-pilot/requirements-ready.lock
      - name: Broker, evaluator and actual framework protocol contracts
        run: |
          python -c "import langchain, langchain_ollama"
          python -m unittest discover -s tools/diagnostic-pilot/tests -v
      - name: Build the real frozen Rust policy
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/diagnostic-pilot-rust
        run: |
          rustup toolchain install 1.92.0 --profile minimal
          cargo +1.92.0 build --locked --release --manifest-path rust/diagnostic-core/Cargo.toml
      - name: Compare fixed, one-pass and Rust on owned development controls
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/diagnostic-pilot-rust
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import subprocess
          import sys

          binary = Path(os.environ['CARGO_TARGET_DIR']) / 'release/rentgen-diagnostic-core'
          digest = hashlib.sha256(binary.read_bytes()).hexdigest()
          output = Path(os.environ['RUNNER_TEMP']) / 'diagnostic-pilot-baselines.json'
          subprocess.run([
              sys.executable, '-m', 'diagnostic_pilot.run',
              '--policies', 'fixed', 'one_pass', 'rust',
              '--rust-binary', str(binary), '--rust-sha256', digest,
              '--output', str(output),
          ], cwd='tools/diagnostic-pilot', check=True)
          PY
      - name: Upload experimental development comparison
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: diagnostic-pilot-development-controls
          path: ${{ runner.temp }}/diagnostic-pilot-baselines.json
          if-no-files-found: warn
          retention-days: 14
