name: Anatomy browser qualification
on:
  pull_request:
    paths: ['tools/anatomy-atlas/**', 'tests/anatomy-browser/**', '.github/workflows/anatomy-browser-ci.yml']
  push:
    branches: ['codex/anatomy-**']
    paths: ['tools/anatomy-atlas/**', 'tests/anatomy-browser/**', '.github/workflows/anatomy-browser-ci.yml']
permissions:
  contents: read
concurrency:
  group: anatomy-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  anatomy-browser:
    name: Static anatomy real-browser qualification
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.15.0'
      - name: Install locked browser test tooling without elevation
        run: |
          test "$(id -u)" -ne 0
          npm ci --prefix tests/anatomy-browser --ignore-scripts
          cd tests/anatomy-browser
          npx --no-install playwright install chromium
      - name: Build standalone repository-derived atlas
        working-directory: tools/anatomy-atlas
        run: |
          python3 tools/extract_anatomy.py --repo "$GITHUB_WORKSPACE" --commit 6c8feb291dd251826eebb99e145f4a39f56cda47 --output .
          python3 tools/verify_generated.py --output .
          npm run build
      - name: Verify exact checkout and run sandboxed browser tests
        working-directory: tests/anatomy-browser
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          npm test
      - name: Record exact checkout and outcome even on failure
        if: always()
        working-directory: tests/anatomy-browser
        run: npm run receipt
      - name: Upload bounded browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: anatomy-browser-evidence
          path: |
            tests/anatomy-browser/output/junit.xml
            tests/anatomy-browser/output/report.json
            tests/anatomy-browser/output/qualification.json
            tests/anatomy-browser/output/results/**/*.png
            tests/anatomy-browser/output/results/**/*.json
          if-no-files-found: error
          retention-days: 14
